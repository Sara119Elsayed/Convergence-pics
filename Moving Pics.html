<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Images</title>
    <link rel="stylesheet" href="moving-pics.css">
</head>
<body>
    <header class="topbar">
        <div class="container">
            <div class="title-wrap">
                <span class="eyebrow">Frontend Animation Project</span>
                <h1 class="project-title">Moving Pics</h1>
            </div>
        </div>
    </header>
    <div id="images" aria-live="polite">
        <img src="images/icon1.gif" id="im1" alt="Image 1">
        <img src="images/icon2.gif" id="im2" alt="Image 2">
        <img src="images/TOP.JPG" id="im3" alt="Image 3">
        <div class="caption" id="caption">Ready</div>
    </div>

    <div class="controls" role="region" aria-label="Playback controls">
        <input type="button" value="Play" id="go" aria-pressed="false" aria-label="Play or pause animation">
        <input type="button" value="Stop" id="stop" aria-label="Stop animation">
        <input type="button" value="Reset" id="reset" aria-label="Reset positions">
        <div class="speed-control" aria-label="Speed control">
            <span class="label-inline">Speed</span>
            <input id="speed" type="range" min="1" max="5" value="3" step="1" aria-valuemin="1" aria-valuemax="5">
        </div>
    </div>
    <footer class="note">Tip: press <strong>Space</strong> to toggle Play/Pause.</footer>

    <script src="moving-pics.js" defer></script>
</body>
</html>
